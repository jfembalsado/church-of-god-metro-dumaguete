<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer Circle Background -->
  <circle cx="100" cy="100" r="95" fill="#0f172a" stroke="#b45309" stroke-width="3"/>
  
  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="85" fill="#1e293b" stroke="#b45309" stroke-width="2"/>
  
  <!-- Cross (Main Symbol) -->
  <g transform="translate(100, 85)">
    <!-- Vertical bar of cross -->
    <rect x="-6" y="-35" width="12" height="70" fill="#b45309" rx="2"/>
    <!-- Horizontal bar of cross -->
    <rect x="-25" y="-12" width="50" height="12" fill="#b45309" rx="2"/>
    <!-- Cross decorative top -->
    <circle cx="0" cy="-35" r="8" fill="#f8fafc" stroke="#b45309" stroke-width="2"/>
  </g>
  
  <!-- Holy Spirit Flame/Dove symbol above cross -->
  <g transform="translate(100, 50)">
    <!-- Flame/Dove shape -->
    <path d="M 0 -8 Q -6 -2 -6 6 Q -6 12 0 14 Q 6 12 6 6 Q 6 -2 0 -8" fill="#b45309" opacity="0.8"/>
    <!-- Highlight -->
    <circle cx="-2" cy="2" r="2" fill="#f8fafc" opacity="0.6"/>
  </g>
  
  <!-- Text Circle - Top -->
  <defs>
    <path id="topCurve" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
    <path id="bottomCurve" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  </defs>
  
  <!-- Top text along curve -->
  <text font-size="11" font-weight="bold" letter-spacing="2" fill="#b45309" font-family="Arial, sans-serif">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
      CHURCH OF GOD
    </textPath>
  </text>
  
  <!-- Bottom text along curve -->
  <text font-size="10" font-weight="bold" letter-spacing="1.5" fill="#f8fafc" font-family="Arial, sans-serif">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">
      NEGROS ISLAND PHILIPPINES INC
    </textPath>
  </text>
  
  <!-- Center Scripture Text -->
  <text x="100" y="155" font-size="8" font-weight="bold" text-anchor="middle" fill="#b45309" font-family="Arial, sans-serif">
    1 TIMOTHY 3:15
  </text>
  
  <!-- Decorative corner elements -->
  <g fill="#b45309" opacity="0.6">
    <circle cx="25" cy="25" r="3"/>
    <circle cx="175" cy="25" r="3"/>
    <circle cx="25" cy="175" r="3"/>
    <circle cx="175" cy="175" r="3"/>
  </g>
</svg>