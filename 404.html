<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Church of God Metro Dumaguete</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #b45309;
            --text-light: #f8fafc;
            --bg-light: #f1f5f9;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--primary);
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 3rem 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        h1 {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            background-color: var(--accent);
            color: white;
            padding: 0.75rem 2rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.3s;
        }
        a:hover {
            background-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>We're sorry, the page you're looking for doesn't exist. It may have been moved or deleted.</p>
        <a href="/">Return to Home</a>
    </div>
</body>
</html>
